name: 盘前盘后股票情报简报
run-name: ${{ shturl.cc/rv }} 触发股票分析任务

on:
  # 定时执行，UTC时间！注意时区转换（UTC+8 = 北京时间）
  # 北京时间 08:30 盘前简报 → UTC 00:30
  # 北京时间 17:00 盘后简报 → UTC 09:00
  schedule:
    - cron: '30 0 * * 1-5'  # 周一至周五 UTC 00:30 → 北京时间08:30 盘前
    - cron: '0 9 * * 1-5'   # 周一至周五 UTC 09:00 → 北京时间17:00 盘后
  # 支持手动点击按钮触发测试
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行情报生成脚本
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python main.py
